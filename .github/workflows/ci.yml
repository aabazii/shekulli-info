name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Run tests + build check on every push and PR ─────────────────────────────
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm test

      - name: Wrangler build check (dry-run)
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check for hardcoded passwords in source
        run: |
          if grep -rn "shekulli2026" src/ api/ --include="*.js" 2>/dev/null; then
            echo "ERROR: Hardcoded password found in source"
            exit 1
          fi
          echo "✓ No hardcoded passwords found"

      - name: Check for hardcoded tokens in HTML
        run: |
          if grep -rn "shekulli2026\|Shekulli2026" *.html 2>/dev/null; then
            echo "ERROR: Hardcoded password found in HTML file"
            exit 1
          fi
          echo "✓ No hardcoded passwords in HTML"

  # ── Deploy CF Worker to production — only on push to main ────────────────────
  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke tests — verify live site after deploy
        run: npm run test:smoke
        env:
          SITE_URL: https://shekulli.info

  e2e:
    name: E2E Browser Tests
    needs: deploy-worker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SITE_URL: https://shekulli.info

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
