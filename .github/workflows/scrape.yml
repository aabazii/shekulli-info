name: Scrape Facebook Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger Cloudflare scrape
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_PASSWORD }}" \
            -H "X-FB-Token: ${{ secrets.FB_PAGE_TOKEN }}" \
            https://shekulli.info/api/scrape \
            | cat
